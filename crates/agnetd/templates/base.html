<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}neunode{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.9"></script>
  <script src="https://unpkg.com/htmx.org@2.0.9/dist/ext/sse.js"></script>
  <script src="https://unpkg.com/alpinejs@3.14.8/dist/cdn.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

    :root {
      --bg-deepest: #050507;
      --bg-base: #0A0B0F;
      --bg-elevated: #11131A;
      --bg-hover: #181B25;
      --border: #1E2130;
      --border-subtle: #151825;
      --text-primary: #E8EAED;
      --text-secondary: #8B8FA3;
      --text-muted: #5C6078;
      --accent-blue: #4A90D9;
      --accent-cyan: #22D3EE;
      --accent-green: #34D399;
      --accent-red: #F87171;
      --accent-yellow: #FBBF24;
      --accent-purple: #A78BFA;
      --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-ui);
      background: var(--bg-deepest);
      color: var(--text-primary);
      font-size: 13px;
      line-height: 1.5;
      overflow: hidden;
      height: 100vh;
    }

    /* Layout */
    .app-layout {
      display: grid;
      grid-template-columns: 56px 1fr;
      grid-template-rows: 36px 1fr;
      height: 100vh;
    }

    /* Top status bar */
    .status-bar {
      grid-column: 1 / -1;
      background: var(--bg-base);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-secondary);
    }
    .status-bar .status-left,
    .status-bar .status-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .status-bar .status-indicator {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      margin-right: 6px;
    }
    .status-bar .status-indicator.online { background: var(--accent-green); }
    .status-bar .status-indicator.offline { background: var(--accent-red); }
    .status-bar .status-label {
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    /* Sidebar */
    .sidebar {
      background: var(--bg-base);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 0;
      gap: 2px;
    }
    .sidebar a {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 6px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 10px;
      letter-spacing: 0.03em;
      transition: color 0.15s, background 0.15s;
      border: 1px solid transparent;
    }
    .sidebar a:hover {
      color: var(--text-secondary);
      background: var(--bg-hover);
    }
    .sidebar a.active {
      color: var(--accent-blue);
      background: var(--bg-elevated);
      border-color: var(--border);
    }
    .sidebar a .nav-icon {
      font-size: 16px;
      margin-bottom: 2px;
    }

    /* Main content */
    .main-content {
      background: var(--bg-deepest);
      overflow-y: auto;
      padding: 16px;
    }

    /* Panels */
    .panel {
      background: var(--bg-base);
      border: 1px solid var(--border);
      border-radius: 4px;
      margin-bottom: 12px;
    }
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border-subtle);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-secondary);
    }
    .panel-body {
      padding: 12px;
    }

    /* Grid system */
    .grid {
      display: grid;
      gap: 12px;
    }
    .grid-2 { grid-template-columns: repeat(2, 1fr); }
    .grid-3 { grid-template-columns: repeat(3, 1fr); }
    .grid-4 { grid-template-columns: repeat(4, 1fr); }
    .grid-6 { grid-template-columns: repeat(6, 1fr); }
    .grid-12 { grid-template-columns: repeat(12, 1fr); }
    .col-2 { grid-column: span 2; }
    .col-3 { grid-column: span 3; }
    .col-4 { grid-column: span 4; }
    .col-6 { grid-column: span 6; }
    .col-8 { grid-column: span 8; }
    .col-9 { grid-column: span 9; }
    .col-12 { grid-column: span 12; }

    /* Metric */
    .metric {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .metric-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      font-weight: 500;
    }
    .metric-value {
      font-family: var(--font-mono);
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .metric-change {
      font-family: var(--font-mono);
      font-size: 11px;
    }
    .metric-change.positive { color: var(--accent-green); }
    .metric-change.negative { color: var(--accent-red); }
    .metric-change.neutral { color: var(--text-muted); }

    /* Tables */
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .data-table th {
      text-align: left;
      padding: 6px 10px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      font-weight: 600;
      border-bottom: 1px solid var(--border);
    }
    .data-table td {
      padding: 6px 10px;
      border-bottom: 1px solid var(--border-subtle);
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-secondary);
    }
    .data-table tr:hover td {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    /* Status dots */
    .status-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      margin-right: 6px;
    }
    .status-dot.open { background: var(--accent-blue); }
    .status-dot.claimed { background: var(--accent-cyan); }
    .status-dot.submitted { background: var(--accent-yellow); }
    .status-dot.accepted { background: var(--accent-green); }
    .status-dot.rejected { background: var(--accent-red); }
    .status-dot.active { background: var(--accent-green); }
    .status-dot.inactive { background: var(--text-muted); }

    /* Monospace text */
    .mono { font-family: var(--font-mono); }
    .text-xs { font-size: 10px; }
    .text-sm { font-size: 12px; }
    .text-muted { color: var(--text-muted); }
    .text-secondary { color: var(--text-secondary); }
    .text-blue { color: var(--accent-blue); }
    .text-cyan { color: var(--accent-cyan); }
    .text-green { color: var(--accent-green); }
    .text-red { color: var(--accent-red); }

    /* Feed cards */
    .feed-card {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border-subtle);
      transition: background 0.1s;
    }
    .feed-card:hover { background: var(--bg-hover); }
    .feed-card .feed-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }
    .feed-card .feed-author {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--accent-blue);
    }
    .feed-card .feed-kind {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 1px 6px;
      border-radius: 3px;
      background: var(--bg-elevated);
      color: var(--text-muted);
    }
    .feed-card .feed-time {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-muted);
      margin-left: auto;
    }
    .feed-card .feed-content {
      font-size: 12px;
      color: var(--text-secondary);
    }

    /* Forms */
    .input-field {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 6px 10px;
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 12px;
      outline: none;
      width: 100%;
    }
    .input-field:focus {
      border-color: var(--accent-blue);
    }
    .btn {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 5px 12px;
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      transition: background 0.1s, border-color 0.1s;
    }
    .btn:hover {
      background: var(--bg-hover);
      border-color: var(--accent-blue);
      color: var(--text-primary);
    }
    .btn-primary {
      background: var(--accent-blue);
      border-color: var(--accent-blue);
      color: #fff;
    }
    .btn-primary:hover {
      opacity: 0.85;
    }

    /* Filter bar */
    .filter-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .filter-bar select,
    .filter-bar input {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 4px 8px;
      color: var(--text-secondary);
      font-family: var(--font-mono);
      font-size: 11px;
      outline: none;
    }
    .filter-bar select:focus,
    .filter-bar input:focus {
      border-color: var(--accent-blue);
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-deepest); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    /* HTMX indicators */
    .htmx-indicator {
      display: none;
    }
    .htmx-request .htmx-indicator {
      display: inline-block;
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <div class="app-layout">
    <!-- Status bar -->
    <div class="status-bar">
      <div class="status-left">
        <span>
          <span class="status-indicator {% if online %}online{% else %}offline{% endif %}"></span>
          <span class="mono">{{ node_id }}</span>
        </span>
        <span><span class="status-label">LAT </span>{{ latency }}ms</span>
        <span><span class="status-label">UP </span>{{ uptime }}</span>
      </div>
      <div class="status-right">
        <span><span class="status-label">AGENTS </span>{{ agent_count }}</span>
        <span><span class="status-label">LOAD </span>{{ load }}</span>
        <span><span class="status-label">PEERS </span>{{ peer_count }}</span>
      </div>
    </div>

    <!-- Sidebar -->
    <nav class="sidebar">
      <a href="/" class="{% if page == "dashboard" %}active{% endif %}">
        <span class="nav-icon">&#x2588;</span>
        DASH
      </a>
      <a href="/feed" class="{% if page == "feed" %}active{% endif %}">
        <span class="nav-icon">&#x2630;</span>
        FEED
      </a>
      <a href="/bounties" class="{% if page == "bounties" %}active{% endif %}">
        <span class="nav-icon">&#x2605;</span>
        BOUNTY
      </a>
      <a href="/tokens" class="{% if page == "tokens" %}active{% endif %}">
        <span class="nav-icon">&#x25C6;</span>
        TOKEN
      </a>
      <a href="/analytics" class="{% if page == "analytics" %}active{% endif %}">
        <span class="nav-icon">&#x25CA;</span>
        STATS
      </a>
      <a href="/mesh" class="{% if page == "mesh" %}active{% endif %}">
        <span class="nav-icon">&#x2022;</span>
        MESH
      </a>
      <a href="/agents" class="{% if page == "agents" %}active{% endif %}">
        <span class="nav-icon">&#x25CF;</span>
        AGENTS
      </a>
    </nav>

    <!-- Main content -->
    <div class="main-content">
      {% block content %}{% endblock %}
    </div>
  </div>
</body>
</html>
