name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --workspace

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check all features
        run: cargo check --workspace --all-features

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - name: Audit reachable dependencies
        run: ./scripts/security_audit.sh

  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: "v1.5.1"
      - name: Install dependencies
        run: cd sdk && npm install
      - name: Build daemon for integration tests
        run: cargo build -p agnetd
      - name: Build contracts for E2E tests
        run: cd contracts && forge build
      - name: Build
        run: cd sdk && npm run build
      - name: Typecheck
        run: cd sdk && npm run typecheck
      - name: Check Rust/TypeScript protocol drift
        run: cd sdk && npm run check:protocol
      - name: Check Solidity/TypeScript ABI drift
        run: cd sdk && npm run check:abi
      - name: Lint
        run: cd sdk && npm run lint
      - name: Test (unit)
        run: cd sdk && npm test
      - name: Test (CLI integration)
        run: cd sdk && npm run test:integration
      - name: Test (contract E2E)
        run: cd sdk && npm run test:e2e

  mcp-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/mcp-server/package-lock.json
      - name: Install dependencies
        run: cd packages/mcp-server && npm ci
      - name: Typecheck
        run: cd packages/mcp-server && npm run typecheck
      - name: Test
        run: cd packages/mcp-server && npm test
      - name: Build
        run: cd packages/mcp-server && npm run build
