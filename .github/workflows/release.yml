name: Release

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  verify-contracts:
    uses: ./.github/workflows/contracts-ci.yml

  build:
    needs: [verify, verify-contracts]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux-x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux-arm64
          - target: aarch64-apple-darwin
            os: macos-latest
            platform: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install aarch64 cross-compilation toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libclang-dev \
            llvm-dev

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release -p agnetd --target ${{ matrix.target }}
        env:
          CC_aarch64_unknown_linux_gnu: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'aarch64-linux-gnu-gcc' || '' }}
          CXX_aarch64_unknown_linux_gnu: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'aarch64-linux-gnu-g++' || '' }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'aarch64-linux-gnu-gcc' || '' }}
          BINDGEN_EXTRA_CLANG_ARGS: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && '--target=aarch64-unknown-linux-gnu --sysroot=/usr/aarch64-linux-gnu' || '' }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agnetd-${{ matrix.platform }}
          path: target/${{ matrix.target }}/release/agnetd

  smoke-artifact:
    needs: build
    strategy:
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-latest
          - platform: linux-arm64
            os: ubuntu-24.04-arm
          - platform: darwin-arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: agnetd-${{ matrix.platform }}
          path: release-bin
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: chmod +x release-bin/agnetd
      - run: cd sdk && npm ci && npm run test:beta
        env:
          NEUNODE_TEST_BINARY: ${{ github.workspace }}/release-bin/agnetd
      - name: Verify packed SDK and MCP against the native release binary
        run: |
          mkdir -p packed
          (cd sdk && npm run build && npm pack --pack-destination "$GITHUB_WORKSPACE/packed")
          (cd packages/mcp-server && npm ci && npm run build && npm pack --pack-destination "$GITHUB_WORKSPACE/packed")
          node scripts/beta_package_smoke.mjs release-bin/agnetd packed/neunode-sdk-*.tgz packed/neunode-mcp-server-*.tgz

  release:
    needs: [build, smoke-artifact]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Rename binaries for release
        run: |
          for dir in artifacts/agnetd-*; do
            platform=$(basename "$dir" | sed 's/agnetd-//')
            mv "$dir/agnetd" "$dir/agnetd-$platform"
          done
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  publish-npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build SDK and MCP packages
        run: |
          (cd sdk && npm ci && npm run build)
          (cd packages/mcp-server && npm ci && npm run build)
      - name: Set versions from tag
        run: node scripts/prepare_npm_release.mjs "${GITHUB_REF_NAME#v}"

      - name: Place binaries in platform packages
        run: |
          cp artifacts/agnetd-linux-x64/agnetd packages/agnetd-linux-x64/agnetd
          cp artifacts/agnetd-linux-arm64/agnetd packages/agnetd-linux-arm64/agnetd
          cp artifacts/agnetd-darwin-arm64/agnetd packages/agnetd-darwin-arm64/agnetd
          chmod +x packages/agnetd-*/agnetd

      - name: Publish platform packages
        run: |
          NPM_DIST_TAG=latest
          [[ "$GITHUB_REF_NAME" == *-* ]] && NPM_DIST_TAG=beta
          for pkg in packages/agnetd-linux-x64 packages/agnetd-linux-arm64 packages/agnetd-darwin-arm64; do
            echo "Publishing $pkg..."
            cd "$GITHUB_WORKSPACE/$pkg"
            npm publish --access public --tag "$NPM_DIST_TAG"
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish daemon, SDK and MCP packages
        run: |
          NPM_DIST_TAG=latest
          [[ "$GITHUB_REF_NAME" == *-* ]] && NPM_DIST_TAG=beta
          for pkg in packages/agnetd sdk packages/mcp-server; do
            (cd "$GITHUB_WORKSPACE/$pkg" && npm publish --access public --tag "$NPM_DIST_TAG")
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
