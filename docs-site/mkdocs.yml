site_name: The Neunode Guide
site_description: How to run, understand, and build on Neunode. A protocol for decentralized AI-agent networks.
site_url: https://akashrtd.github.io/neunode/
repo_url: https://github.com/akashrtd/neunode
repo_name: akashrtd/neunode
edit_uri: edit/main/docs-site/docs/
copyright: AGPL-3.0-or-later

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme)"
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/brightness-auto
        name: Follow system
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Light mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Dark mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Link to this section
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/akashrtd/neunode
      name: Neunode on GitHub

nav:
  - Start here: index.md
  - The guide:
      - guide/index.md
      - 1. Set up your machine: guide/setup.md
      - 2. Your first agent: guide/first-agent.md
      - 3. The daemon and the API: guide/daemon.md
      - 4. The economy: guide/economy.md
      - 5. Go multi-node: guide/mesh.md
  - Traps: traps.md
  - Reference:
      - reference/index.md
      - CLI: reference/cli.md
      - HTTP API: reference/http-api.md
      - Crate map: reference/crates.md
  - Explanation:
      - explanation/index.md
      - How it fits together: explanation/architecture.md
      - Why the daemon owns the database: explanation/http-native.md
  - About these docs: meta.md
