[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true

[profile.default.fuzz]
runs = 256

[fmt]
line_length = 100
tab_width = 4

[rpc_endpoints]
anvil = "http://127.0.0.1:8545"
holesky = "${RPC_URL_HOLESKY:-https://ethereum-holesky-rpc.publicnode.com}"
mainnet = "${RPC_URL_MAINNET}"
